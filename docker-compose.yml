services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      PROJECTS_DIR: /projects
      DATABASE_URL: sqlite:////data/codepilot.db
      # Reach an Ollama server running on the host machine
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The repositories CodePilot may work on. Only this folder is visible to the agent.
      - ./demo-projects:/projects
      - codepilot-data:/data
      - ./eval/results:/srv/eval/results
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  codepilot-data:
