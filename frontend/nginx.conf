server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Server-Sent Events: deliver each event immediately instead of buffering the response.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Single-page app: unknown paths (e.g. /sessions/abc) are handled by React Router.
    location / {
        try_files $uri /index.html;
    }
}
